<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="PostBox-M terminal demo: two machines claim the same task, one wins, the delivery carries a hash">
  <rect x="0.5" y="0.5" width="879" height="371" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="879" height="34" rx="10" fill="#161b22"/>
  <rect x="0.5" y="24" width="879" height="11" fill="#161b22"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text x="440" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3bcc7">three machines · one folder · no server</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="24" y="64" fill="#7ee787">$</text>
    <text x="42" y="64" fill="#e6edf3">postbox providers</text>

    <text x="42" y="88" fill="#c9d1d9">git</text>
    <text x="148" y="88" fill="#7ee787">yes</text>
    <text x="210" y="88" fill="#9da7b3">a private repo · one commit per write</text>

    <text x="42" y="108" fill="#c9d1d9">local</text>
    <text x="148" y="108" fill="#7ee787">yes</text>
    <text x="210" y="108" fill="#9da7b3">any folder your sync tool already replicates</text>

    <text x="42" y="128" fill="#c9d1d9">gdrive</text>
    <text x="148" y="128" fill="#8b949e">no</text>
    <text x="210" y="128" fill="#9da7b3">Google Drive (works, just needs Google)</text>

    <text x="24" y="162" fill="#7ee787">$</text>
    <text x="42" y="162" fill="#e6edf3">postbox new --to bob --title "weekly report"</text>
    <text x="42" y="184" fill="#79c0ff">20261104-1900-alice-to-bob-01</text>
    <text x="430" y="184" fill="#6e7681"># machine A · exit 0</text>

    <text x="24" y="212" fill="#7ee787">$</text>
    <text x="42" y="212" fill="#e6edf3">postbox ack 20261104-1900-alice-to-bob-01</text>
    <text x="430" y="212" fill="#6e7681"># machine B</text>
    <text x="42" y="234" fill="#7ee787">ok — you own it now</text>

    <text x="24" y="262" fill="#7ee787">$</text>
    <text x="42" y="262" fill="#e6edf3">postbox ack 20261104-1900-alice-to-bob-01</text>
    <text x="430" y="262" fill="#6e7681"># machine C, same second</text>
    <text x="42" y="284" fill="#ffa657">conflict: already accepted by bob  (exit 3)</text>

    <text x="24" y="312" fill="#7ee787">$</text>
    <text x="42" y="312" fill="#e6edf3">postbox result 20261104-1900-alice-to-bob-01 --artifact weekly.md --verified</text>
    <text x="42" y="334" fill="#79c0ff">RESULT bob.md</text>
    <text x="150" y="334" fill="#9da7b3">weekly.md · 4.1 KB · sha256 3dd7…412c</text>
  </g>
</svg>
