name: release

# Tag-driven PyPI release through trusted publishing (no API token in the repo).
# One-time setup on pypi.org: Account -> Publishing -> "Add a new pending publisher"
#   PyPI project: postbox-m
#   Owner: lx67621956-create
#   Repository: PostBox-M
#   Workflow: release.yml
#   Environment: pypi
# After that, `git tag v0.3.0 && git push --tags` publishes.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Flipped on only after the trusted publisher exists on pypi.org
    # (repo Settings -> Variables -> PYPI_READY=true). Until then a tag still
    # produces downloadable artifacts on the Release page, without a red build.
    if: ${{ vars.PYPI_READY == 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
