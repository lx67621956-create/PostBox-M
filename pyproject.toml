[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postbox-m"
version = "0.1.0"
description = "A shared folder as the message bus between autonomous agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "闷闷AI说" }]
keywords = [
  "multi-agent", "agent-orchestration", "google-drive", "rclone",
  "task-queue", "file-based", "offline-first", "llm-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
postbox = "postbox.cli:main"

[project.urls]
Homepage = "https://github.com/lx67621956-create/PostBox-M"
Source = "https://github.com/lx67621956-create/PostBox-M"

[tool.hatch.build.targets.wheel]
packages = ["postbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
